<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Битва Нескінченності</title>
<style>
body{margin:0;min-height:100vh;background:#0b0b1e;color:#fff;
font-family:sans-serif;text-align:center;user-select:none;padding:16px;box-sizing:border-box}
h1{font-size:1.6rem;margin:8px 0}
.stats{display:flex;justify-content:space-around;color:#9aa;margin-bottom:12px}
#enemy{font-size:110px;cursor:pointer;margin:10px 0;transition:transform .08s}
#enemy.hit{transform:scale(.88)}
.bar{height:16px;background:#2a2a4a;border-radius:8px;overflow:hidden;margin:0 auto;max-width:320px}
#hp{height:100%;width:100%;background:#ef4444;transition:width .1s}
button{display:block;width:100%;max-width:320px;margin:10px auto;padding:14px;
font-size:1rem;border:0;border-radius:12px;background:#7c3aed;color:#fff}
button:disabled{background:#3b3b5c;color:#888}
</style>
</head>
<body>
<h1>⚔️ Битва Нескінченності</h1>
<div class="stats">
  <div>Хвиля: <b id="wave">1</b></div>
  <div>💰 <b id="gold">0</b></div>
  <div>🗡️ <b id="dmg">1</b></div>
</div>
<div id="enemy">👹</div>
<div class="bar"><div id="hp"></div></div>
<p id="hptxt"></p>
<button id="b1" onclick="buy(1)"></button>
<button id="b2" onclick="buy(2)"></button>

<script>
const faces=["👹","👺","💀","👻","🐉","🧟","👾","🦂"];
let s={wave:1,gold:0,dmg:1,auto:0,hp:10,max:10};
try{const d=localStorage.getItem("boi");if(d)s=JSON.parse(d)}catch(e){}

const $=id=>document.getElementById(id);
const cost1=()=>Math.floor(10*Math.pow(1.5,s.dmg-1));
const cost2=()=>Math.floor(25*Math.pow(1.6,s.auto));

function newEnemy(){
  s.max=Math.floor(10*Math.pow(1.35,s.wave-1));
  s.hp=s.max;
  $("enemy").textContent=faces[(s.wave-1)%faces.length];
}
function hit(n){
  s.hp-=n;
  if(s.hp<=0){
    s.gold+=Math.ceil(s.wave*3);
    s.wave++;
    newEnemy();
  }
  draw();
}
function buy(t){
  if(t==1&&s.gold>=cost1()){s.gold-=cost1();s.dmg++}
  if(t==2&&s.gold>=cost2()){s.gold-=cost2();s.auto++}
  draw();
}
function draw(){
  $("wave").textContent=s.wave;
  $("gold").textContent=s.gold;
  $("dmg").textContent=s.dmg;
  $("hp").style.width=Math.max(0,s.hp/s.max*100)+"%";
  $("hptxt").textContent=Math.max(0,s.hp)+" / "+s.max+" HP";
  $("b1").textContent="🗡️ Сильніший удар (+1) — "+cost1()+" 💰";
  $("b1").disabled=s.gold<cost1();
  $("b2").textContent="🤖 Авто-атака ("+s.auto+"/сек) — "+cost2()+" 💰";
  $("b2").disabled=s.gold<cost2();
  try{localStorage.setItem("boi",JSON.stringify(s))}catch(e){}
}
$("enemy").onclick=()=>{
  $("enemy").classList.add("hit");
  setTimeout(()=>$("enemy").classList.remove("hit"),80);
  hit(s.dmg);
};
setInterval(()=>{if(s.auto>0)hit(s.auto)},1000);
newEnemy.call();
if(s.hp<=0||!s.max)newEnemy();
else $("enemy").textContent=faces[(s.wave-1)%faces.length];
draw();
</script>
</body>
</html>
